name: Build THEK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android structure
        run: |
          flutter create --org com.thek --project-name thek --platforms=android .

      - name: Fix Kotlin version
        run: |
          sed -i "s|id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"|id \"org.jetbrains.kotlin.android\" version \"1.9.24\"|" android/settings.gradle
          sed -i "s|id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"|id \"org.jetbrains.kotlin.android\" version \"1.9.24\"|" android/settings.gradle.kts 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thek-apk
          path: build/app/outputs/flutter-apk/app-release.apk
