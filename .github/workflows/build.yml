name: Build THEK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android structure
        run: |
          flutter create --org com.thek --project-name thek --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Patch flutter_vless for modern Gradle
        run: |
          find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" -exec sed -i 's/packaging\s*{/packagingOptions {/g' {} \;
          find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" -exec sed -i 's/compileSdkVersion\s*[0-9]*/compileSdkVersion 34/g' {} \;
          find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" -exec sed -i 's/targetSdkVersion\s*[0-9]*/targetSdkVersion 34/g' {} \;

      - name: DEBUG — show Android gradle files
        run: |
          echo "===== android/build.gradle ====="
          cat android/build.gradle 2>/dev/null || echo "NOT FOUND"
          echo "===== android/settings.gradle ====="
          cat android/settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo "===== android/settings.gradle.kts ====="
          cat android/settings.gradle.kts 2>/dev/null || echo "NOT FOUND"

      - name: Patch Kotlin everywhere
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' android/settings.gradle.kts
            sed -i -E 's/id\("com.android.application"\) version "[^"]*"/id("com.android.application") version "8.1.4"/g' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" android/build.gradle
            sed -i -E 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.24"/g' android/build.gradle
          fi
          echo "===== AFTER PATCH ====="
          cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle 2>/dev/null || echo "nothing"

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: THEK v1.3.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
