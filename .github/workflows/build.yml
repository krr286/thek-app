name: Build THEK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android structure
        run: |
          flutter create --org com.thek --project-name thek --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Patch flutter_vless HEAVY
        run: |
          set -e
          FOUND=0
          while IFS= read -r f; do
            echo "=== FOUND: $f ==="
            cp "$f" "${f}.bak"
            # Все возможные вариации packaging
            sed -i 's/\bpackaging\b/packagingOptions/g' "$f"
            sed -i 's/packagingOptionsOptions/packagingOptions/g' "$f"
            # SDK versions
            sed -i 's/compileSdk[^0-9]*[0-9]\+/compileSdk 34/g' "$f"
            sed -i 's/targetSdk[^0-9]*[0-9]\+/targetSdk 34/g' "$f"
            sed -i 's/minSdk[^0-9]*[0-9]\+/minSdk 21/g' "$f"
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/g' "$f"
            sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 34/g' "$f"
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' "$f"
            echo "--- AFTER ---"
            cat "$f"
            FOUND=1
          done < <(find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" 2>/dev/null)
          if [ $FOUND -eq 0 ]; then
            echo "!!! flutter_vless_android build.gradle NOT FOUND !!!"
            find /home/runner/.pub-cache -path "*flutter_vless*" -name "*.gradle*" 2>/dev/null | head -20
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --release --verbose 2>&1 | tail -100

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: THEK v2.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
