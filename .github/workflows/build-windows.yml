name: Build THEK Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Enable Windows
        run: flutter config --enable-windows-desktop
      - name: Generate Windows
        run: flutter create --org com.thek --project-name thek --platforms=windows .
      - name: Dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TheK-Client-Windows.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: thek-windows
          path: TheK-Client-Windows.zip
          retention-days: 30
      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: THEK Windows v1.0.${{ github.run_number }}
          files: TheK-Client-Windows.zip
