name: Build THEK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android structure
        run: flutter create --org com.thek --project-name thek --platforms=android .

      - name: Show Android gradle files
        run: |
          echo "=== ls android ==="
          ls -la android/
          echo "=== settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo "=== settings.gradle.kts ==="
          cat android/settings.gradle.kts 2>/dev/null || echo "NOT FOUND"

      - name: Get dependencies
        run: flutter pub get

      - name: Patch flutter_vless
        run: |
          find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" -exec sed -i 's/\bpackaging\b/packagingOptions/g' {} \;
          find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" -exec sed -i 's/packagingOptionsOptions/packagingOptions/g' {} \;
          find /home/runner/.pub-cache -path "*flutter_vless_android*" -name "build.gradle" -exec sed -i 's/compileSdk[^0-9]*[0-9]\+/compileSdk 34/g' {} \;

      - name: Patch Kotlin (both formats)
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext\.kotlin_version\s*=\s*['\"][^'\"]*['\"]/ext.kotlin_version = '1.9.24'/g" android/build.gradle
          fi
          echo "=== AFTER PATCH ==="
          cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle 2>/dev/null || echo "nothing"

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: THEK v3.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
