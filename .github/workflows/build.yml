name: Build THEK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android structure
        run: flutter create --org com.thek --project-name thek --platforms=android .

      - name: Patch Android SDK to 35
        run: |
          # Patch app/build.gradle — compileSdk и targetSdk
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' android/app/build.gradle
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/g' android/app/build.gradle
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 35/g' android/app/build.gradle
            sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 35/g' android/app/build.gradle
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 21/g' android/app/build.gradle
          fi
          # Patch app/build.gradle.kts — Kotlin DSL
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 21/g' android/app/build.gradle.kts
          fi
          echo "===== app/build.gradle ====="
          cat android/app/build.gradle 2>/dev/null | head -40 || cat android/app/build.gradle.kts 2>/dev/null | head -40

      - name: Patch Kotlin + AGP
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle
            sed -i -E 's/id "com\.android\.application" version "[^"]*"/id "com.android.application" version "8.5.2"/g' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/id\("org\.jetbrains\.kotlin\.android"\) version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.0.21"/g' android/settings.gradle.kts
            sed -i -E 's/id\("com\.android\.application"\) version "[^"]*"/id("com.android.application") version "8.5.2"/g' android/settings.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext\.kotlin_version = '[^']*'/ext.kotlin_version = '2.0.21'/g" android/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.${{ github.run_number }}
          name: THEK v7.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
