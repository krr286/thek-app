name: Build THEK Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows structure
        run: flutter create --org com.thek --project-name thek --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TheK-Client-Windows.zip
          Get-Item TheK-Client-Windows.zip | Format-List Length, Name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: thek-windows-v${{ github.run_number }}
          path: TheK-Client-Windows.zip
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: THEK Windows v1.0.${{ github.run_number }}
          files: TheK-Client-Windows.zip
          draft: false
          prerelease: false
